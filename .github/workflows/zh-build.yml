name: Chinese Android validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zh-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos
      - name: Run all Flutter tests
        run: flutter test --no-pub --reporter=expanded
      - name: Build independently installable ARM64 validation APK
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi
      - name: Verify APK identity and signature
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          apk = pathlib.Path('build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk')
          if not apk.is_file():
              raise SystemExit('ARM64 APK was not produced')
          sdk = pathlib.Path(os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME'])
          tools = sorted(sdk.glob('build-tools/*/aapt'))
          signer = sorted(sdk.glob('build-tools/*/apksigner'))
          if not tools or not signer:
              raise SystemExit('Android package verification tools were not found')
          badging = subprocess.check_output([str(tools[-1]), 'dump', 'badging', str(apk)], text=True)
          package = re.search(r"package: name='([^']+)' versionCode='(\d+)'", badging)
          if not package or package.groups() != ('com.hermesagent.hermes_android.dev', '21502'):
              raise SystemExit('Unexpected APK package or versionCode: ' + badging.splitlines()[0])
          print(badging.splitlines()[0])
          subprocess.run([str(signer[-1]), 'verify', '--print-certs', str(apk)], check=True)
          print(f'APK bytes: {apk.stat().st_size}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-android-zh-CN-arm64-validation
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            pubspec.lock
          if-no-files-found: error
          retention-days: 30
